<main class="password-reset">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Réinitialiser le mot de passe</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (submitted) {
        <p>Votre mot de passe a été mis à jour.</p>
        <button mat-flat-button (click)="login()">Se connecter</button>
      } @else {
        <form [formGroup]="form" (ngSubmit)="save()">
          <mat-form-field>
            <mat-label>Nouveau mot de passe</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="new-password">
            <mat-hint>12 caractères minimum</mat-hint>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Confirmer le mot de passe</mat-label>
            <input matInput type="password" formControlName="confirmation" autocomplete="new-password">
          </mat-form-field>
          @if (error) {
            <p class="error">Le lien est invalide ou expiré, ou les mots de passe ne correspondent pas.</p>
          }
          <button mat-flat-button type="submit">Mettre à jour le mot de passe</button>
        </form>
      }
    </mat-card-content>
  </mat-card>
</main>
