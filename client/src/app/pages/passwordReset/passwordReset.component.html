<main class="password-reset">
  <section class="card shadow-sm mb-3">
    <header class="card-header text-center">
      <h2 class="card-title h5 mb-0">Réinitialiser le mot de passe</h2>
    </header>
    <div class="card-body">
      @if (submitted) {
        <p>Votre mot de passe a été mis à jour.</p>
        <button class="btn btn-outline-primary" (click)="login()">Se connecter</button>
      } @else {
        <form [formGroup]="form" (ngSubmit)="save()">
          <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input class="form-control" type="password" formControlName="password" autocomplete="new-password">
            <div class="form-text">12 caractères minimum</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmer le mot de passe</label>
            <input class="form-control" type="password" formControlName="confirmation" autocomplete="new-password">
          </div>
          @if (error) {
            <p class="error">Le lien est invalide ou expiré, ou les mots de passe ne correspondent pas.</p>
          }
          <button class="btn btn-outline-primary" type="submit">Mettre à jour le mot de passe</button>
        </form>
      }
    </div>
  </section>
</main>
