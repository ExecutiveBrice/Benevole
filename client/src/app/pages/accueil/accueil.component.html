<div class="row marge">
@for (evenement of evenements; track evenement.id) {
    <div class="col-6 col-md-4 col-lg-2">
      <section class="card shadow-sm mb-3" [routerLink]="['/',evenement?.id]">
            <button class="full-width" type="button" >
                {{evenement.eventName}}</button>
            @if (evenement.affiche) {
                <img [src]="evenement.affiche" alt="Affiche">
                }
      </section>
    </div>
}
</div>
