@if (evenement; as currentEvenement) {
  @if (!currentEvenement.lock) {
  <div class="page-container event-page-container">
    <div class="row g-4 align-items-start event-panels" [class.mobile-panel-1]="activeMobilePanel === 1"
      [class.mobile-panel-2]="activeMobilePanel === 2">
      <div class="col-12 col-lg-4 event-panel" [class.mobile-panel-active]="activeMobilePanel === 0">
        <app-connexion
          [benevole]="benevole"
          [evenement]="currentEvenement"
          (actionEmitter)="isBenevoleExiste($event)">
        </app-connexion>
      </div>

      <div class="col-12 col-lg-4 event-panel" [class.mobile-panel-active]="activeMobilePanel === 1">
        <app-planning
          [benevole]="benevole"
          [evenement]="currentEvenement"
          (actionEmitter)="isBenevoleExiste($event)">
        </app-planning>
      </div>

      <div class="col-12 col-lg-4 event-panel" [class.mobile-panel-active]="activeMobilePanel === 2">
        <app-info [evenement]="currentEvenement"></app-info>
      </div>
    </div>
  </div>
  } @else {
Evenement bloqué temporairement.
    Soyez patient
}
}
