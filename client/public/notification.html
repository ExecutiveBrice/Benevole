<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Notification — Bénévoles</title>
  <link rel="icon" href="/icons/app-icon.svg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #f4f6f8; color: #212529; font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 640px; margin: 8vh auto; padding: clamp(24px, 5vw, 40px); background: white; border-radius: 16px; box-shadow: 0 4px 24px #00000012; }
    .label, time { color: #59636e; font-size: 15px; }
    h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.3; margin: 16px 0; overflow-wrap: anywhere; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; margin: 24px 0 32px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #0b5ed7; color: white; font-weight: 600; text-decoration: none; }
    a:hover { background: #094eae; }
    a:focus-visible { outline: 3px solid #212529; outline-offset: 4px; }
  </style>
  <script src="/notification.js" defer></script>
</head>
<body>
  <main aria-labelledby="title">
    <div class="label">Bénévoles · Notification reçue</div>
    <h1 id="title">Bénévoles</h1>
    <time id="received" hidden></time>
    <p id="message">Vos choix ont bien été pris en compte.</p>
    <a id="event-link" href="/">Ouvrir l’événement</a>
  </main>
</body>
</html>
