spring:
  datasource:
    # Valeurs de développement local. Les variables SPRING_DATASOURCE_*
    # fournies par Docker Compose les remplacent automatiquement.
    url: ${DB_URL:jdbc:postgresql://localhost:8106/db_benevole}
    username: ${DB_USER:benevoles}
    password: ${DB_PASSWORD:benevolespass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show_sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: update
      show_sql: false
      format_sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

image-storage-dir: C:\Users\PC\Documents\ProjetsDev\Benevoles

server:
  port: 8006